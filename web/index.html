<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0A14">
<title>Harmon</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Chivo+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div class="wrap">

  <header>
    <h1><span class="rune">&#9834;</span>Harmon</h1>
    <span class="tag" id="subtitle">music library</span>
    <div class="themepick" id="themepick"></div>
    <div class="pill">
      <span class="dot" id="dot"></span>
      <span id="worker-text">Idle</span>
    </div>
  </header>
  <div class="prog"><i id="worker-bar"></i></div>

  <nav class="toptabs" id="toptabs">
    <button class="toptab on" data-tab="overview">Overview</button>
    <button class="toptab" data-tab="duplicates">Duplicates<b id="badge-dupes"></b></button>
    <button class="toptab" data-tab="metadata">Metadata</button>
    <button class="toptab" data-tab="format">Format<b id="badge-format"></b></button>
    <button class="toptab" data-tab="review">Review<b id="badge-review"></b></button>
    <button class="toptab" data-tab="settings">Settings</button>
  </nav>

  <div class="bar">
    <button id="btn-scan">Scan library</button>
    <button class="go" id="btn-pipeline">Run a full pass</button>
  </div>

  <div class="tabpanel active" data-panel="overview"></div>
  <div class="tabpanel" data-panel="duplicates"></div>
  <div class="tabpanel" data-panel="metadata"></div>
  <div class="tabpanel" data-panel="format"></div>
  <div class="tabpanel" data-panel="review"></div>
  <div class="tabpanel" data-panel="settings"></div>

</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
