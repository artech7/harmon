<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Harmon: concentric grooves with a clean sector cut through them —
       a record, and the tidying-up that is the whole point of the app. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FE3C4"/>
      <stop offset=".55" stop-color="#A98BFF"/>
      <stop offset="1" stop-color="#F2B03D"/>
    </linearGradient>
    <mask id="cut">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M32 32 L64 14 L64 30 Z" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0C0A14"/>
  <g mask="url(#cut)" fill="none" stroke="url(#g)" stroke-linecap="round">
    <circle cx="32" cy="32" r="21" stroke-width="2.4" opacity=".95"/>
    <circle cx="32" cy="32" r="15.5" stroke-width="2" opacity=".7"/>
    <circle cx="32" cy="32" r="10" stroke-width="1.8" opacity=".45"/>
  </g>
  <circle cx="32" cy="32" r="3.4" fill="url(#g)"/>
</svg>
