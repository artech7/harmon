services:
  harmon:
    build: .
    container_name: harmon
    restart: unless-stopped

    # Runs as you, so anything Harmon writes into your home share stays yours.
    # Check the numbers with:  id Dylan
    user: "1026:100"

    ports:
      - "8730:8730"

    environment:
      - TZ=America/Denver

    # Synology's Docker bridge often hands containers a DNS server they cannot
    # actually use. Without this, every metadata lookup fails with
    # "Temporary failure in name resolution". Swap in your router or Pi-hole
    # address if you would rather keep lookups on your own network.
    dns:
      - 1.1.1.1
      - 8.8.8.8

    volumes:
      # Harmon's database and settings
      - /volume1/docker/harmon/config:/config

      # Your music library — read and written
      - /volume1/homes/Dylan/Media/Music:/music

      # Replaced sources and removed duplicates land here
      - /volume1/homes/Dylan/Media/music-originals:/originals
