# Builds the image on every push to main and publishes it to GitHub's registry
# at ghcr.io/artech7/harmon:latest. Use this if you would rather pull a prebuilt
# image than build on the NAS.
name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/harmon:latest
            ghcr.io/${{ github.repository_owner }}/harmon:${{ github.sha }}
